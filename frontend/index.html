<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3efe6" />
  <title>一脉 · 把家人的故事记下来</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand-lockup">
      <span class="brand-seal" aria-hidden="true">家<br />谱</span>
      <div class="brand">一脉</div>
      <span class="brand-caption">有来处，有牵挂。</span>
    </div>
    <div class="auth" aria-label="登录家谱">
      <label class="auth-field">账号
        <input id="email" type="email" autocomplete="username" placeholder="请输入账号" value="demo@yimai.test" />
      </label>
      <label class="auth-field">密码
        <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" value="password" />
      </label>
      <button type="button" id="btn-login" class="secondary">登录</button>
    </div>
  </header>

  <main class="workspace">
    <div class="workspace-head">
      <div class="page-title">
        <p class="eyebrow">家 人 · 世 代 · 故 事</p>
        <h1>我们的家谱<span class="title-dot" aria-hidden="true">。</span></h1>
      </div>
      <div class="workspace-tools">
        <div class="stats" id="stats" role="status">登录后，就可以看见家里的人</div>
        <div class="toolbar-actions">
          <button type="button" id="btn-reload" class="ghost" disabled><span aria-hidden="true">↻</span> 重新载入</button>
          <button type="button" id="btn-add" disabled><span aria-hidden="true">＋</span> 添加</button>
        </div>
      </div>
    </div>

    <div class="layout">
      <section class="canvas-wrap" aria-label="家谱书页">
        <div class="canvas-heading">
          <span class="canvas-label">世系一览</span>
          <span>点一位家人，读一段小传</span>
        </div>
        <div class="canvas-stage">
          <div id="empty" class="empty">
            <svg class="empty-book" viewBox="0 0 100 80" fill="none" aria-hidden="true">
              <path d="M50 19C39 11 22 10 9 14v48c14-4 28-3 41 5 13-8 27-9 41-5V14c-13-4-30-3-41 5Z" />
              <path d="M50 19v48M20 27c7-1 13 0 20 3M20 37c7-1 13 0 20 3M20 47c7-1 13 0 20 3M61 30c6-3 12-4 19-3M61 40c6-3 12-4 19-3" />
              <path class="book-ribbon" d="M72 12v18l5-4 5 3V12" />
            </svg>
            <p class="empty-title">把家人的名字，慢慢记下来</p>
            <p>一位亲人，一段故事，一代代相连。</p>
            <p class="hint" id="empty-hint">用上方预填的演示账号登录，翻开这本家谱。</p>
          </div>
          <svg id="tree-canvas" aria-label="家族图谱"></svg>
        </div>
        <div class="canvas-foot">
          <div class="legend" aria-label="家谱连线说明">
            <span><i class="legend-parent" aria-hidden="true"></i>父母与子女</span>
            <span><i class="legend-spouse" aria-hidden="true"></i>夫妻</span>
            <span><i class="legend-sibling" aria-hidden="true"></i>兄弟姐妹</span>
            <span><i class="legend-view" aria-hidden="true"></i>当前视角</span>
          </div>
          <span class="canvas-footnote">一笔一画，留住来处</span>
        </div>
      </section>

      <aside id="sheet" class="sheet hidden" aria-label="家人小传与记录" aria-live="polite">
        <div class="sheet-head">
          <div>
            <p class="eyebrow" id="sheet-kicker">家人小传</p>
            <h2 id="sheet-title">家人</h2>
          </div>
          <button type="button" id="btn-close-sheet" class="ghost close-sheet">收起 <span aria-hidden="true">×</span></button>
        </div>

        <div id="sheet-detail">
          <div id="sheet-summary" class="sheet-summary"></div>
          <div class="sheet-actions perspective-action">
            <button type="button" id="btn-set-root">从TA看这棵家谱</button>
          </div>
          <p class="perspective-note">从这位亲人出发，重新展开家谱。</p>

          <section class="sheet-section" id="add-section">
            <h3 class="form-heading">添加</h3>
            <p class="section-hint" id="add-hint">选中当前人后，点一种关系，写下名字即可。</p>
            <p class="section-hint" id="add-anchor-label" hidden></p>
            <div class="kin-grid" id="kin-grid" role="group" aria-label="添加亲人">
              <button type="button" data-kin="father">父</button>
              <button type="button" data-kin="mother">母</button>
              <button type="button" data-kin="elder_brother">哥</button>
              <button type="button" data-kin="elder_sister">姐</button>
              <button type="button" data-kin="younger_brother">弟</button>
              <button type="button" data-kin="younger_sister">妹</button>
              <button type="button" data-kin="son">儿</button>
              <button type="button" data-kin="daughter">女</button>
              <button type="button" data-kin="husband">夫</button>
              <button type="button" data-kin="wife">妻</button>
            </div>

            <form id="form-add" class="form-stack add-form hidden">
              <p id="add-context" class="form-lead"></p>
              <label class="add-name-emphasis">叫什么（必填）<input id="add-name" type="text" maxlength="64" required placeholder="例如：张素芬" /></label>
              <div class="form-pair">
                <label>哪一年出生的（可空）<input id="add-birth-year" type="number" min="1" max="9999" placeholder="记不清就空着" /></label>
                <label>若已去世，是哪一年（可空）<input id="add-death-year" type="number" min="1" max="9999" placeholder="还在世就空着" /></label>
              </div>
              <label id="add-parent-role-wrap" class="hidden">这位是孩子的
                <select id="add-parent-role">
                  <option value="">请选择父亲或母亲</option>
                  <option value="father">父亲</option>
                  <option value="mother">母亲</option>
                </select>
              </label>
              <label id="add-existing-wrap">或者，这位已经在谱里
                <select id="add-existing"></select>
              </label>
              <p id="add-error" class="form-error hidden" role="alert"></p>
              <div class="sheet-actions add-actions">
                <button type="submit" id="btn-submit-add">记下</button>
                <button type="button" id="btn-cancel-add" class="ghost">先不添了</button>
              </div>
            </form>
          </section>

          <p id="sheet-error" class="form-error hidden" role="alert"></p>
          <p class="sheet-note">点树上的人，打开这位的介绍。添加时请先选中当前人，再选父、母、哥、姐、弟、妹、儿、女、夫、妻。</p>
        </div>
      </aside>
    </div>
    <footer class="page-footer"><span>一脉相承 · 家人常在</span><span>把名字记下，让故事有处安放。</span></footer>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
